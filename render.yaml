services:
  - type: web
    name: tick-watch-scanner
    env: python
    plan: free # Change to starter if you want 24/7 without pingers
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: FYERS_CLIENT_ID
        sync: false
      - key: FYERS_SECRET_KEY
        sync: false
      - key: FYERS_REDIRECT_URI
        sync: false
      - key: FYERS_ID
        sync: false
      - key: FYERS_PASSWORD
        sync: false
      - key: FYERS_TOTP_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: PYTHON_VERSION
        value: 3.10.0
